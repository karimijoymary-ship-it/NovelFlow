services:
  # --------------------------------------------------
  # 1. Spring Boot Backend Web Service
  # --------------------------------------------------
  - type: web
    name: novelflow-backend
    runtime: docker
    dockerfilePath: ./backend/NovelFlow/Dockerfile
    dockerContext: ./backend/NovelFlow
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080

  # --------------------------------------------------
  # 2. Vite React Frontend Static Site
  # --------------------------------------------------
  - type: static
    name: novelflow-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: novelflow-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
