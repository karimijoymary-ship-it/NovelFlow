spring.application.name=NovelFlow

# ── Persistent File-Based H2 Database ──────────────────────────────────────────
# Store the database on disk so data (users, books, telemetry) survives restarts.
spring.datasource.url=jdbc:h2:file:./data/novelflow-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────────────────────────────────────
# Use 'update' to create tables on first run and preserve them on subsequent runs.
# Do NOT use 'create-drop' (destroys data on shutdown) or 'create' (wipes on startup).
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── H2 Web Console (useful for debugging, available at /h2-console) ─────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
